<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('zen-theme') || 'auto'; } catch (e) { document.documentElement.dataset.theme = 'auto'; }</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zen">
  <meta name="description" content="A quiet place to write and sketch. Live Markdown, pictures, and an endless whiteboard.">
  <title>Zen — a quiet place to write</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%237f9590' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <!-- Bump ?v= on styles.css and app.js with every change, so browsers never pair a new page with an old cached file. -->
  <link rel="stylesheet" href="styles.css?v=20261010-5">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer></script>
  <script src="app.js?v=20261010-5" defer></script>
</head>
<body class="intro" data-mode="write">
  <header>
    <a class="brand" href="./" aria-label="Zen writing home"><span class="enso" aria-hidden="true"></span>Zen<span class="brand-note">a quiet place to write</span></a>
    <div class="header-right">
      <div class="modes" role="group" aria-label="Space">
        <button type="button" data-mode="write" aria-pressed="true">Write</button>
        <button type="button" data-mode="board" aria-pressed="false">Board</button>
      </div>
      <nav aria-label="Writing tools">
        <button id="sound-play" type="button" aria-pressed="false" title="Play or pause the sound"><svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg><span class="sr-only" id="sound-play-label">Play</span></button>
        <label class="sr-only" for="sound-select">Sound</label>
        <select id="sound-select" title="Choose a sound"><option value="flute">Flute</option><option value="hangdrum">Hang drum</option><option value="piano" selected>Piano</option><option value="violin">Violin</option><option value="brownnoise">Brown noise</option></select>
        <span class="divider write-only" aria-hidden="true"></span>
        <label class="sr-only" for="restore">Restore a backup from a previous session</label>
        <select id="restore" class="write-only" title="Drafts from your last two sessions" hidden></select>
        <button id="load" class="write-only" type="button">Load<span class="desktop"> .md</span></button>
        <label class="sr-only" for="theme">Theme</label>
        <select id="theme" title="Theme"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option><option value="sepia">Sepia</option></select>
        <button id="fullscreen" type="button" aria-pressed="false" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="sr-only">Full screen</span></button>
        <button id="save" class="save write-only" type="button">Save<span class="desktop"> .md</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg></button>
      </nav>
      <button id="hide-menus" type="button" aria-pressed="false" title="Hide or show menus (Esc shows them)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">Hide menus</span></button>
    </div>
  </header>
  <main>
    <div class="page-heading">
      <span class="eyebrow">LET YOUR THOUGHTS BREATHE</span><span class="small-line" aria-hidden="true"></span>
      <div class="write-tools">
        <button id="write-undo" type="button" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="sr-only">Undo</span></button>
        <button id="write-redo" type="button" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span class="sr-only">Redo</span></button>
        <button id="add-image" type="button" title="Add a picture (you can also paste or drop one)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>Picture</button>
        <button id="focus-mode" type="button" aria-pressed="false" title="Focus mode: dim everything except the line you are writing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6h12M6 18h12" opacity=".35"/><path d="M3 12h18" stroke-width="2.2"/></svg>Focus</button>
        <button id="code-view" type="button" aria-pressed="false" title="Show the Markdown code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>Code</button>
        <label class="sr-only" for="export-writing">Export writing</label>
        <select id="export-writing" title="Export your writing"><option value="" selected disabled>Export</option><option value="md">Markdown (.md)</option><option value="html">Web page (.html)</option><option value="pdf">PDF (print)</option><option value="txt">Plain text (.txt)</option></select>
      </div>
    </div>
    <div class="editor" data-view="rich">
      <label class="sr-only" for="writing">Your writing in Markdown</label>
      <textarea id="writing" placeholder="Begin anywhere…" spellcheck="true"></textarea>
      <div id="rich" class="md is-empty" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Your writing" spellcheck="true" data-placeholder="Begin anywhere…  Type # for a heading, - for a list, **bold**"></div>
    </div>
    <input id="file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown" hidden>
    <input id="image-file" type="file" accept="image/*" multiple hidden>
  </main>
  <section id="board" aria-label="Whiteboard" hidden>
    <canvas id="board-canvas"></canvas>
    <div id="board-text-clip"><div id="board-texts"></div></div>
    <div class="board-tools" role="toolbar" aria-label="Whiteboard tools">
      <button type="button" data-tool="select" aria-pressed="false" title="Select and move (V). Drag on empty space to select an area; Shift adds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 3l14 8-6 2-3 6-5-16z"/></svg><span class="sr-only">Select</span></button>
      <button type="button" data-tool="text" aria-pressed="false" title="Markdown text box (X) — supports $math$"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span class="sr-only">Text box</span></button>
      <button type="button" data-tool="note" aria-pressed="false" title="Sticky note (N) — pick a color for the note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/></svg><span class="sr-only">Sticky note</span></button>
      <button type="button" data-tool="pen" aria-pressed="true" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg><span class="sr-only">Pen</span></button>
      <button type="button" data-tool="eraser" aria-pressed="false" title="Eraser (E)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 20h12M5 15l9-9 5 5-8 8H8l-3-3z"/></svg><span class="sr-only">Eraser</span></button>
      <button type="button" data-tool="hand" aria-pressed="false" title="Move around (H, or hold Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4-6a1.5 1.5 0 0 1 3 0v6-5a1.5 1.5 0 0 1 3 0v6-3a1.5 1.5 0 0 1 3 0v6a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3 14a1.5 1.5 0 0 1 2.4-1.8L7 14"/></svg><span class="sr-only">Move</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" data-tool="rect" aria-pressed="false" title="Rectangle (R, hold Shift for a square)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span class="sr-only">Rectangle</span></button>
      <button type="button" data-tool="ellipse" aria-pressed="false" title="Circle (O, hold Shift for a perfect circle)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg><span class="sr-only">Circle</span></button>
      <button type="button" data-tool="triangle" aria-pressed="false" title="Triangle (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4 21 19H3z"/></svg><span class="sr-only">Triangle</span></button>
      <button type="button" data-tool="line" aria-pressed="false" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5"/></svg><span class="sr-only">Line</span></button>
      <button type="button" data-tool="arrow" aria-pressed="false" title="Arrow (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M10 5h9v9"/></svg><span class="sr-only">Arrow</span></button>
      <button type="button" data-tool="connect" aria-pressed="false" title="Connector (C): drag from one shape, note or picture to another"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2.5" y="3" width="7" height="6" rx="1"/><rect x="14.5" y="15" width="7" height="6" rx="1"/><path d="M6 9v4.5a2 2 0 0 0 2 2h4.5m0 0-2-2m2 2-2 2"/></svg><span class="sr-only">Connector</span></button>
      <button type="button" id="conn-route" title="Connector style: straight, curved or elbow (also changes selected connectors)">Straight</button>
      <button type="button" id="board-image" title="Add a picture (or paste / drop one)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span class="sr-only">Picture</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" class="swatch" data-color="ink" aria-pressed="true" title="Ink"><span></span></button>
      <button type="button" class="swatch" data-color="sage" aria-pressed="false" title="Sage"><span></span></button>
      <button type="button" class="swatch" data-color="rose" aria-pressed="false" title="Rose"><span></span></button>
      <button type="button" class="swatch" data-color="sky" aria-pressed="false" title="Sky"><span></span></button>
      <button type="button" id="board-size" title="Pen size">Fine</button>
      <button type="button" id="board-pressure" aria-pressed="true" title="Pencil pressure: on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 17c3-1 4-6 7-6s3 5 6 5 3-3 5-4"/><path d="M3 17c3-1 4-6 7-6s3 5 6 5 3-3 5-4" stroke-width="4" opacity=".25"/></svg><span class="sr-only">Pencil pressure</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" id="board-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span class="sr-only">Undo</span></button>
      <button type="button" id="board-redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg><span class="sr-only">Redo</span></button>
      <button type="button" id="board-delete" title="Delete selection (Del)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg><span class="sr-only">Delete</span></button>
      <button type="button" id="board-home" title="Back to centre"><span id="board-zoom">100%</span></button>
      <label class="sr-only" for="board-export">Export board</label>
      <select id="board-export" title="Export the board"><option value="" selected disabled>Export</option><option value="png">PNG image</option><option value="jpg">JPG image</option><option value="svg">SVG (vector)</option><option value="pdf">PDF (print)</option><option value="json">Board file (.json)</option></select>
      <label class="board-open" for="board-import-file" title="Open a board file (.json)" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Open</label>
      <button type="button" id="board-clear" title="Clear the board">Clear</button>
    </div>
    <button id="board-hide" type="button" aria-pressed="false" title="Hide menus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="sr-only">Hide or show board menus</span></button>
    <input id="board-import-file" type="file" class="visually-hidden">
    <input id="board-image-file" type="file" accept="image/*" multiple hidden>
  </section>
  <footer><span id="count">0 words</span><span class="footer-center">Nothing to finish. Just a little space to begin.</span><span id="status" role="status" aria-live="polite">Draft stays on this device</span></footer>
  <div id="toast" role="status" hidden></div>
  <div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
